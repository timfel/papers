language: erlang
install:
    - sudo add-apt-repository ppa:texlive-backports/ppa -y
    - sudo apt-get update -y
    - sudo apt-get install texlive-latex-extra texlive-luatex texlive-fonts-extra cm-super texlive-bibtex-extra texlive-lang-english -y
    - git clone https://github.com/krono/swathesis.git
    - pushd swathesis; sudo ./install.sh --tex --bin-local --no-logos; popd
script:
   pdflatex -interaction=nonstopmode Felgentreff_2015_Babelsberg.tex
   bibtex Felgentreff_2015_Babelsberg.aux
   pdflatex -interaction=nonstopmode Felgentreff_2015_Babelsberg.tex
   pdflatex -interaction=nonstopmode Felgentreff_2015_Babelsberg.tex
   curl -T Felgentreff_2015_Babelsberg.pdf http://www.lively-kernel.org/babelsberg/users/timfelgentreff/me.pdf
